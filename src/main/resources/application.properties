spring.application.name=legoBackend

mqtt.broker.host=0.0.0.0
mqtt.broker.port=1883
mqtt.broker.allow-anonymous=true
mqtt.broker.store-directory=target/moquette
# Uncomment to expose the broker over WebSockets as well
# mqtt.broker.websocket-port=8083
# mqtt.broker.websocket-path=/mqtt

# MQTT client settings (used by Spring Integration MQTT adapters)
mqtt.client.enabled=true
mqtt.client.broker-urls=tcp://localhost:1883
mqtt.client.client-id=legoBackendClient
mqtt.client.default-topic=integration/test
mqtt.client.inbound-topics=integration/test
mqtt.client.qos=1
mqtt.client.completion-timeout=5s
